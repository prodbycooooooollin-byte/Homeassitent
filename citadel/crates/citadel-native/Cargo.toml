[package]
name = "citadel-native"
version = "0.1.0"
edition = "2021"
description = "Native Funktionen für CITADEL: Steam-/Deadlock-Erkennung, sichere Dateioperationen mit Backup und Journal, Hardware- und Prozessabfragen."
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
dunce = "1"
thiserror = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Power"] }

[dev-dependencies]
tempfile = "3"
