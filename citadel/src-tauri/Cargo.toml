[package]
name = "citadel"
version = "0.1.0"
description = "CITADEL – Deadlock Settings & Performance"
edition = "2021"
license = "MIT"

[lib]
name = "citadel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
citadel-native = { path = "../crates/citadel-native" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
