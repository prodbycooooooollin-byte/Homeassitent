[package]
name = "onair-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ON AIR – immersiver Installer (eigene Oberfläche, installiert das eingebettete NSIS-Paket)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol: Oberfläche ist immer eingebettet (kein Dev-Server).
tauri = { version = "2", features = ["custom-protocol"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
