name: Vault Sync Mod bauen

on:
  push:
    paths: ['vault-sync-mod/**', '.github/workflows/vault-sync-mod.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vault-sync-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.1" }
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vault-sync-mod
          path: vault-sync-mod/build/libs/vault-sync-1.0.0.jar
