name: Build Discord Word Counter EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "discord-word-counter/**"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: discord-word-counter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: discord-word-counter/requirements.txt
      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: EXE bauen
        run: >
          pyinstaller --noconfirm --onefile --name DiscordWordCounter
          --add-data "dashboard.html;."
          --collect-all discord --collect-all discord.ext.voice_recv
          --collect-all faster_whisper --collect-all ctranslate2
          --collect-all av --collect-all nacl --collect-all cffi --collect-all davey --hidden-import _cffi_backend --collect-all tzdata
          --hidden-import bot --hidden-import dashboard
          main.py
      - name: Beispiel-Konfiguration beilegen
        run: |
          Copy-Item .env.example dist/.env.example
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordWordCounter
          path: |
            discord-word-counter/dist/DiscordWordCounter.exe
            discord-word-counter/dist/.env.example
