name: Aethermoor Windows-Build

on:
  workflow_dispatch:
  push:
    branches: [claude/vibrant-davinci-uwvmfl]
    paths: ['mmorpg/**']

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mmorpg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Aethermoor-Windows
          path: |
            mmorpg/dist/*.exe
            mmorpg/dist/*.zip
