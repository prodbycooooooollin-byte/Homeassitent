name: Release Impostor (Windows-EXE)

# Baut die Windows-App (NSIS-Installer + portable EXE) und veröffentlicht sie als GitHub-Release.
# Auslöser:
#  - Tag "impostor-v<version>" (z. B. impostor-v0.1.0)
#  - Push auf main oder einen claude/*-Branch mit Änderungen unter impostor/
#    → Release-Tag "impostor-v<version aus package.json>" wird angelegt bzw. aktualisiert
#  - manuell über "Run workflow" (optional mit eigenem Tag und Serveradresse)
#
# Die Serveradresse, die in die App eingebaut wird, kommt aus dem Eingabefeld beim manuellen
# Start oder aus der Repository-Variable IMPOSTOR_SERVER_URL (Settings → Secrets and variables
# → Actions → Variables). Ist beides leer, trägt man die Adresse in der App unter
# „Einstellungen → Spielserver" ein.

on:
  push:
    tags:
      - 'impostor-v*'
    branches:
      - main
      - 'claude/**'
    paths:
      - 'impostor/**'
      - '.github/workflows/release-impostor.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag (leer = impostor-v<version>)'
        required: false
      server_url:
        description: 'Standard-Serveradresse der App, z. B. wss://impostor.example.com/ws (leer = Repository-Variable)'
        required: false

permissions:
  contents: write

concurrency:
  group: release-impostor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: impostor
    steps:
      - uses: actions/checkout@v5

      - name: Release-Tag bestimmen
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then TAG="${{ github.event.inputs.tag }}";
          elif [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}";
          else TAG="impostor-v$(node -p "require('./package.json').version")"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release-Tag: $TAG"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: impostor/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: EXE bauen (NSIS-Installer + portable)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          IMPOSTOR_SERVER_URL: ${{ github.event.inputs.server_url || vars.IMPOSTOR_SERVER_URL }}

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: impostor-windows
          path: |
            impostor/release/*.exe
            impostor/release/*.blockmap
          if-no-files-found: error

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Impostor ${{ env.RELEASE_TAG }}
          prerelease: true
          body: |
            Windows-Build von Impostor.

            - `Impostor-Setup-*.exe`: Installer
            - `Impostor-*-portable.exe`: ohne Installation lauffähig

            Die App enthält keinen Spielserver. Sie verbindet sich mit der eingebauten Serveradresse
            bzw. der in der App unter „Einstellungen → Spielserver" eingetragenen Adresse
            (siehe impostor/README.md). Die EXE ist nicht signiert – Windows SmartScreen kann warnen.
          files: impostor/release/*.exe
          overwrite_files: true
