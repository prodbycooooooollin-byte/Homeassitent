name: LumaHome als Webseite veröffentlichen (GitHub Pages)

# Baut lumahome/ und veröffentlicht die Oberfläche unter
# https://<benutzer>.github.io/<repository>/
# Einmalig nötig: Repository → Settings → Pages → Source: „GitHub Actions“.

on:
  push:
    branches:
      - main
    paths:
      - 'lumahome/**'
      - '.github/workflows/deploy-lumahome-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lumahome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lumahome/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lumahome/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
