name: Release LoL Build-Assistent (Windows)

# Baut die Windows-EXE (Installer + portable) und veröffentlicht sie als GitHub-Release.
# Auslöser:
#  - Tag "lol-v<version>" (z. B. lol-v0.1.0)
#  - Push auf main oder einen claude/*-Branch mit Änderungen am Projekt → Release-Tag
#    "lol-v<version aus package.json>" wird beim Anlegen des Releases erzeugt bzw. aktualisiert
#  - manuell über "Run workflow"

on:
  push:
    tags:
      - 'lol-v*'
    branches:
      - main
      - 'claude/**'
    paths:
      - 'lol-build-assistant/**'
      - '.github/workflows/release-lol-build-assistant.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release-Tag (z. B. lol-v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lol-build-assistant
    steps:
      - uses: actions/checkout@v4

      - name: Release-Tag bestimmen
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then TAG="${{ github.event.inputs.tag }}";
          elif [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}";
          else TAG="lol-v$(node -p "require('./package.json').version")"; fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Release-Tag: $TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lol-build-assistant/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Typprüfung
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: EXE bauen (NSIS-Installer + portable)
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: lol-build-assistant-windows
          path: |
            lol-build-assistant/release/*.exe
            lol-build-assistant/release/*.blockmap
          if-no-files-found: error

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: LoL Build-Assistent ${{ env.RELEASE_TAG }}
          prerelease: true
          body: |
            Windows-Build des LoL Build-Assistenten.

            - `LoL-Build-Assistent-Setup-*.exe`: Installer
            - `LoL-Build-Assistent-*-portable.exe`: ohne Installation lauffähig

            Hinweise: Die EXE ist nicht signiert (Windows SmartScreen kann warnen).
            Item-/Championdaten sind für den laufenden Patch fachlich noch nicht geprüft
            (siehe lol-build-assistant/docs/STATUS.md). League im randlosen Fenstermodus spielen.
          files: lol-build-assistant/release/*.exe
          overwrite_files: true
