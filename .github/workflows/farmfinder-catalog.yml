name: FarmFinder Video-Katalog aktualisieren

# Sammelt wöchentlich Farm-Videos per YouTube-API und committet farmfinder/public/catalog.json.
# Die EXE bringt den Katalog dann beim nächsten Release mit – Nutzer brauchen keinen eigenen API-Key.
# Einmalig nötig: Repository-Secret YOUTUBE_API_KEY (Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      versions:
        description: 'Versionen, kommagetrennt (Standard: 26.3,1.21)'
        required: false
        default: '26.3,1.21'

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farmfinder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: farmfinder/package-lock.json
      - run: npm ci
      - name: Katalog bauen
        run: npx tsx scripts/build-catalog.ts --versions "${{ github.event.inputs.versions || '26.3,1.21' }}"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog.json
          git diff --cached --quiet || (git commit -m "FarmFinder: Video-Katalog aktualisiert" && git push)
