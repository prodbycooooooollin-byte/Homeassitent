name: Vault Sync Namen suchen
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/vault-sync-discover.yml']
jobs:
  discover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vault-sync-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.7.0" }
      - run: gradle compileJava --no-daemon || true
      - run: |
          for j in $(find ~/.gradle . -name "*.jar" 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/Minecraft.class"; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR"
          for c in 'net.minecraft.client.gui.components.toasts.Toast' 'net.minecraft.client.gui.components.toasts.Toast$Visibility' 'net.minecraft.client.gui.components.toasts.ToastManager' 'net.minecraft.client.gui.GuiGraphicsExtractor'; do
            echo "== $c"; javap -p -cp "$JAR" "$c" | grep -v "private" | head -60 || true
          done
          echo "== Font"; javap -p -cp "$JAR" net.minecraft.client.gui.Font | grep -i "width\|lineHeight" | head || true
