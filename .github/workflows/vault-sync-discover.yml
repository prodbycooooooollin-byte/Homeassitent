name: Vault Sync Namen suchen
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/vault-sync-discover.yml']
jobs:
  discover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vault-sync-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.7.0" }
      - run: gradle compileJava --no-daemon || true
      - run: |
          MC=""; FAPI=""
          for j in $(find ~/.gradle . -name "*.jar" 2>/dev/null); do
            L=$(unzip -l "$j" 2>/dev/null)
            [ -z "$MC" ] && echo "$L" | grep -q "net/minecraft/client/Minecraft.class" && MC="$j"
            [ -z "$FAPI" ] && echo "$L" | grep -q "net/fabricmc/fabric/api/client/screen/v1/ScreenMouseEvents.class" && FAPI="$j"
            [ -n "$MC" ] && [ -n "$FAPI" ] && break
          done
          echo "MC=$MC"; echo "FAPI=$FAPI"
          CP="$MC:$FAPI"
          for c in 'net.fabricmc.fabric.api.client.screen.v1.ScreenMouseEvents' 'net.fabricmc.fabric.api.client.screen.v1.ScreenMouseEvents$AllowMouseClick' 'net.fabricmc.fabric.api.client.screen.v1.ScreenEvents' 'net.fabricmc.fabric.api.client.screen.v1.ScreenEvents$AfterInit' 'net.minecraft.client.input.MouseButtonEvent' 'net.minecraft.client.gui.screens.Screen'; do
            echo "== $c"; javap -p -cp "$CP" "$c" | grep -v "private" | grep -i "click\|AllowMouse\|AfterInit\|x()\|y()\|button\|register\|interface\|class\|record\|width\|height\|Event<" | head -25 || true
          done
