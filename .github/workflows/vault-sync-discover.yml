name: Vault Sync Namen suchen
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/vault-sync-discover.yml']
jobs:
  discover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vault-sync-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.7.0" }
      - run: gradle compileJava --no-daemon || true
      - run: |
          JAR=$(find ~/.gradle -name "minecraft*.jar" -path "*loom*" ! -name "*sources*" | xargs ls -S | head -1)
          echo "JAR=$JAR"
          echo "== Minecraft: Toast"; javap -cp "$JAR" net.minecraft.client.Minecraft | grep -i toast
          echo "== SystemToast"; javap -cp "$JAR" 'net.minecraft.client.gui.components.toasts.SystemToast' | head -30
          echo "== SystemToastId"; javap -cp "$JAR" 'net.minecraft.client.gui.components.toasts.SystemToast$SystemToastId' | head
