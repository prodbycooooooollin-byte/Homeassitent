# Render Blueprint – im Render-Dashboard "New +" → "Blueprint" wählen und
# dieses Repository verbinden. Render legt daraus automatisch den Web-
# Service UND eine verwaltete PostgreSQL-Datenbank an und verknüpft sie.
#
# Nach dem ersten Deploy: NEXTAUTH_URL und NEXT_PUBLIC_SITE_URL im Render-
# Dashboard auf die von Render vergebene URL setzen (die ist vor dem ersten
# Deploy noch nicht bekannt) und den Service einmal neu deployen. Optionale
# Variablen (Twitch, SMTP) ebenfalls im Dashboard nachtragen – siehe
# winrace/README.md.

services:
  - type: web
    name: winrace
    runtime: docker
    plan: starter
    rootDir: winrace
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: winrace-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: TWITCH_CLIENT_ID
        sync: false
      - key: TWITCH_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: winrace-db
    plan: starter
    databaseName: winrace
    user: winrace
