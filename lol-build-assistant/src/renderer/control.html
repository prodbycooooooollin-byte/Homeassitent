<!doctype html>
<html lang="de">
<head>

  <title>LoL Build-Assistent – Steuerung</title>
  <link rel="stylesheet" href="control.css" />
</head>
<body>
  <header>
    <h1>LoL Build-Assistent</h1>
    <div id="modebar"></div>
  </header>
  <main>
    <section id="summary" class="card wide"></section>
    <section id="settings" class="card"></section>
    <section id="enemies" class="card"></section>
    <section id="sim" class="card"></section>
    <section id="history" class="card"></section>
    <section id="details" class="card wide"></section>
    <section id="data" class="card wide"></section>

  <footer>Hotkeys: Strg+Umschalt+O Overlay ein/aus · +E aufklappen · +L verschieben/bedienen · +↑/↓ Größe · +K Steuerung. Die App berät nur – du entscheidest und kaufst selbst.</footer>
