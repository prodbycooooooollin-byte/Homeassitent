<!doctype html>
<html><head><meta charset="utf-8"><title>VICE INTEL</title>
<style>
  html,body{margin:0;height:100%;background:#06050a;color:#f5f3fa;font-family:"Segoe UI",system-ui,sans-serif;-webkit-app-region:drag;overflow:hidden}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(60% 70% at 70% 0%,#3b1767 0%,#06050a 70%)}
  h1{margin:0;font:800 italic 44px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:-1.5px}
  h1 span{background:linear-gradient(90deg,#c084fc,#fb71a0);-webkit-background-clip:text;color:transparent}
  .bar{margin-top:26px;width:140px;height:3px;border-radius:3px;background:#1d1830;overflow:hidden}
  .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#a855f7,#fb71a0);animation:s 1.1s ease-in-out infinite}
  @keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  p{margin-top:14px;font-size:12px;color:#8b84a0;letter-spacing:.12em;text-transform:uppercase}
</style></head>
<body><h1>VICE <span>INTEL</span></h1><div class="bar"><i></i></div><p>Starting</p></body></html>
